<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>WiFi Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0b0f1a;
      --surface:   #161d2e;
      --border:    #1e2d40;
      --accent:    #2563eb;
      --accent-lt: #3b82f6;
      --recv:      #1e293b;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --danger:    #ef4444;
      --safe:      #22c55e;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Join screen ─────────────────────────────────────── */
    #joinScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 12px;
    }
    #joinScreen .logo {
      font-size: 3rem;
      margin-bottom: 8px;
    }
    #joinScreen h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    #joinScreen p {
      font-size: .85rem;
      color: var(--muted);
      margin-bottom: 16px;
      text-align: center;
    }
    #joinScreen input {
      width: 100%;
      max-width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #joinScreen input:focus { border-color: var(--accent-lt); }
    #joinScreen button {
      width: 100%;
      max-width: 340px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    #joinScreen button:active { background: #1d4ed8; }
    #joinError {
      color: var(--danger);
      font-size: .82rem;
      text-align: center;
      min-height: 20px;
    }

    /* ── Chat screen ─────────────────────────────────────── */
    #chatScreen {
      display: none;
      flex: 1;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* Blocked banner */
    #blockedBanner {
      display: none;
      background: var(--danger);
      color: #fff;
      text-align: center;
      padding: 8px 16px;
      font-size: .85rem;
      font-weight: 600;
    }

    /* Header */
    #chatHeader {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #chatHeader .avatar {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1rem;
    }
    #chatHeader .info { flex: 1; }
    #chatHeader .device-id { font-weight: 600; font-size: .9rem; word-break: break-all; }
    #chatHeader .sub { font-size: .72rem; color: var(--muted); }
    #chatHeader .badge {
      font-size: .68rem; padding: 3px 8px; border-radius: 9999px;
      font-weight: 600; background: #064e3b; color: #34d399;
    }
    #chatHeader .badge.blocked { background: #7f1d1d; color: #f87171; }

    /* Receiver bar */
    #receiverBar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #receiverBar label { font-size: .75rem; color: var(--muted); white-space: nowrap; }
    #receiverSelect {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: .85rem;
      outline: none;
    }
    #receiverSelect:focus { border-color: var(--accent-lt); }
    #manualReceiver {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      color: var(--text);
      font-size: .85rem;
      outline: none;
      display: none;
    }
    #toggleManual {
      background: none; border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 10px;
      color: var(--muted); font-size: .75rem; cursor: pointer; white-space: nowrap;
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .msg-row.sent   { align-self: flex-end; align-items: flex-end; }
    .msg-row.recv   { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 10px 14px;
      border-radius: 18px;
      font-size: .9rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .sent  .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .recv  .bubble { background: var(--recv);   color: var(--text); border-bottom-left-radius: 4px; }

    .msg-meta {
      font-size: .65rem;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .sys-msg {
      align-self: center;
      font-size: .72rem;
      color: var(--muted);
      background: var(--surface);
      border-radius: 9999px;
      padding: 4px 12px;
      margin: 4px 0;
    }

    .block-tag {
      display: inline-block;
      font-size: .6rem;
      background: #1e3a5f;
      color: #7dd3fc;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* Input bar */
    #inputBar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      padding-bottom: max(10px, env(safe-area-inset-bottom));
    }
    #msgInput {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px 16px;
      color: var(--text);
      font-size: .9rem;
      outline: none;
      resize: none;
      max-height: 100px;
      overflow-y: auto;
    }
    #msgInput:focus { border-color: var(--accent-lt); }
    #sendBtn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #sendBtn:active { background: #1d4ed8; }
    #sendBtn:disabled { background: var(--border); cursor: default; }

    #attachBtn {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #attachBtn:active { background: var(--border); }
    #attachBtn:disabled { opacity: 0.4; cursor: default; }
    #attachBtn.has-file { border-color: var(--accent-lt); color: var(--accent-lt); }

    #fileChipBar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 6px 12px;
      display: none;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .file-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: .8rem;
      flex: 1;
      overflow: hidden;
    }
    .chip-name {
      font-family: monospace;
      color: var(--text);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .chip-size { color: var(--muted); font-size: .72rem; white-space: nowrap; }
    #removeFileBtn {
      background: none; border: none;
      color: var(--muted); font-size: .85rem;
      cursor: pointer; padding: 0; line-height: 1; flex-shrink: 0;
    }
    #removeFileBtn:hover { color: var(--danger); }

    /* ── File bubble ─────────────────────────────────────── */
    .file-bubble {
      border-radius: 16px;
      padding: 12px 14px;
      min-width: 220px;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .file-bubble.file-bubble-sent {
      background: #1a2d4a;
      border: 1px solid #2563eb55;
      border-bottom-right-radius: 4px;
    }
    .file-bubble.file-bubble-recv {
      background: #1a2535;
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .file-bubble-header { display: flex; align-items: center; gap: 10px; }
    .file-icon { font-size: 1.6rem; flex-shrink: 0; }
    .file-bubble-info { flex: 1; overflow: hidden; }
    .file-bubble-name {
      font-size: .85rem; font-weight: 600; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-bubble-size { font-size: .72rem; color: var(--muted); margin-top: 2px; }
    .file-bubble-hash {
      font-family: monospace; font-size: .68rem;
      color: var(--muted); background: var(--bg);
      border-radius: 6px; padding: 4px 8px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .file-bubble-actions { display: flex; gap: 6px; }
    .file-bubble-btn {
      flex: 1; background: var(--bg);
      border: 1px solid var(--border); border-radius: 8px;
      padding: 5px 0; color: var(--text);
      font-size: .72rem; cursor: pointer; font-weight: 500;
    }
    .file-bubble-btn:hover { background: var(--border); }
    .file-bubble-btn.primary {
      background: var(--accent); border-color: var(--accent); color: #fff;
    }
    .file-bubble-btn.primary:hover { background: #1d4ed8; }

    /* ── Preview modal ───────────────────────────────────── */
    #previewModal {
      position: fixed; inset: 0; z-index: 1000;
      display: none; align-items: flex-end; justify-content: center;
    }
    #previewOverlay { position: absolute; inset: 0; background: rgba(0,0,0,.65); }
    .modal-card {
      position: relative; z-index: 1;
      background: var(--surface);
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      width: 100%; max-height: 80dvh;
      display: flex; flex-direction: column;
      border: 1px solid var(--border); border-bottom: none;
    }
    .modal-header {
      display: flex; align-items: center;
      padding: 14px 16px 10px; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .modal-title { flex: 1; font-weight: 600; font-size: .9rem; word-break: break-all; }
    .modal-close {
      background: none; border: none;
      color: var(--muted); font-size: 1.2rem; cursor: pointer; padding: 0;
    }
    .modal-meta {
      padding: 6px 16px; font-size: .68rem;
      color: var(--muted); border-bottom: 1px solid var(--border);
      font-family: monospace; flex-shrink: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    #previewContent {
      flex: 1; overflow-y: auto;
      padding: 14px 16px;
      font-family: monospace; font-size: .8rem;
      line-height: 1.6; color: var(--text);
      white-space: pre-wrap; word-break: break-word; margin: 0;
    }
  </style>
</head>
<body>

<!-- ── Join Screen ─────────────────────────────────────────── -->
<div id="joinScreen">
  <div class="logo">📡</div>
  <h1>WiFi Chat</h1>
  <p>Enter your device ID to join the network.<br>Use your MAC address or any unique name.</p>
  <input id="deviceIdInput" type="text" placeholder="Device ID (e.g. AA:BB:CC:DD:EE:01)"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <input id="hostnameInput" type="text" placeholder="Your name (optional)">
  <button onclick="joinNetwork()">Join Network</button>
  <div id="joinError"></div>
</div>

<!-- ── Chat Screen ─────────────────────────────────────────── -->
<div id="chatScreen">

  <div id="blockedBanner">🚫 You are blocked by the admin — you cannot send messages or files</div>

  <!-- Header -->
  <div id="chatHeader">
    <div class="avatar" id="avatarLetter">?</div>
    <div class="info">
      <div class="device-id" id="headerDeviceId">—</div>
      <div class="sub">WiFi Blockchain Network</div>
    </div>
    <span class="badge" id="statusBadge">Online</span>
  </div>

  <!-- Receiver selector -->
  <div id="receiverBar">
    <label>To:</label>
    <select id="receiverSelect">
      <option value="">— select device —</option>
    </select>
    <input id="manualReceiver" type="text" placeholder="or type ID…"
           autocomplete="off" autocorrect="off" autocapitalize="off">
    <button id="toggleManual" onclick="toggleManualInput()">✎</button>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div class="sys-msg">You joined the network</div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept=".txt,text/plain" style="display:none">

  <!-- File chip (visible when a file is attached) -->
  <div id="fileChipBar">
    <div class="file-chip">
      <span>📎</span>
      <span class="chip-name" id="chipName"></span>
      <span class="chip-size" id="chipSize"></span>
      <button id="removeFileBtn" onclick="removeFile()" title="Remove attachment">✕</button>
    </div>
  </div>

  <!-- Input -->
  <div id="inputBar">
    <button id="attachBtn" onclick="triggerFileInput()" title="Attach .txt file">📎</button>
    <textarea id="msgInput" rows="1" placeholder="Message…"
              oninput="autoResize(this)"
              onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()" disabled>➤</button>
  </div>

</div>

<!-- ── Preview Modal ────────────────────────────────────── -->
<div id="previewModal">
  <div id="previewOverlay" onclick="closePreview()"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span class="modal-title" id="previewFilename"></span>
      <button class="modal-close" onclick="closePreview()" title="Close">✕</button>
    </div>
    <div class="modal-meta" id="previewMeta"></div>
    <pre id="previewContent"></pre>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/socket.io@4.6.1/client-dist/socket.io.min.js"></script>
<script>
  const socket = io();
  let myId = '';
  let isBlocked = false;
  let manualMode = false;
  let attachedFile = null;
  let attachedContent = null;
  const fileBubbleStore = {}; // key → {content, filename, hash, blockIdx}

  // ── Join ──────────────────────────────────────────────────
  function joinNetwork() {
    const id = document.getElementById('deviceIdInput').value.trim();
    const name = document.getElementById('hostnameInput').value.trim();
    if (!id) {
      document.getElementById('joinError').textContent = 'Please enter a device ID.';
      return;
    }
    document.getElementById('joinError').textContent = '';
    myId = id;

    // Register with server
    fetch('/api/device/connect', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({mac: id, metadata: name ? {hostname: name} : {}})
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        document.getElementById('joinError').textContent = data.error;
        return;
      }
      // Join SocketIO room
      socket.emit('join', {mac: id, role: 'client'});

      // Show chat screen
      document.getElementById('joinScreen').style.display = 'none';
      const chat = document.getElementById('chatScreen');
      chat.style.display = 'flex';

      // Set header
      const label = name || id;
      document.getElementById('headerDeviceId').textContent = label;
      document.getElementById('avatarLetter').textContent = label.charAt(0).toUpperCase();
      document.getElementById('sendBtn').disabled = false;

      // Load device list
      refreshDevices();
    })
    .catch(() => {
      document.getElementById('joinError').textContent = 'Could not connect to server.';
    });
  }

  // ── Receiver ──────────────────────────────────────────────
  function refreshDevices() {
    fetch('/api/devices')
      .then(r => r.json())
      .then(data => {
        const sel = document.getElementById('receiverSelect');
        const current = sel.value;
        sel.innerHTML = '<option value="">— select device —</option>'
          + (data.devices || [])
              .filter(d => d.mac !== myId)
              .map(d => {
                const label = d.hostname ? `${d.hostname} (${d.mac})` : d.mac;
                return `<option value="${d.mac}" ${d.mac === current ? 'selected' : ''}>${label}</option>`;
              }).join('');
      });
  }

  function toggleManualInput() {
    manualMode = !manualMode;
    document.getElementById('receiverSelect').style.display = manualMode ? 'none' : 'flex';
    document.getElementById('manualReceiver').style.display = manualMode ? 'block' : 'none';
    document.getElementById('toggleManual').textContent = manualMode ? '☰' : '✎';
  }

  function getReceiver() {
    if (manualMode) return document.getElementById('manualReceiver').value.trim();
    return document.getElementById('receiverSelect').value.trim();
  }

  // ── Send ──────────────────────────────────────────────────
  function sendMessage() {
    if (isBlocked) return;
    const receiver = getReceiver();
    if (!receiver) { flashInput('receiverSelect'); return; }

    if (attachedFile) {
      sendFile(receiver);
      return;
    }

    const payload = document.getElementById('msgInput').value.trim();
    if (!payload) { flashInput('msgInput'); return; }

    fetch('/api/message/send', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({sender: myId, receiver, payload})
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        appendSysMsg('❌ ' + data.error);
        return;
      }
      appendBubble('sent', payload, data.transaction?.timestamp, data.block_index);
      document.getElementById('msgInput').value = '';
      document.getElementById('msgInput').style.height = '';
    });
  }

  function sendFile(receiver) {
    const filename = attachedFile.name;
    const content  = attachedContent;

    fetch('/api/file/send', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sender: myId, receiver, filename, content})
    })
    .then(r => r.json())
    .then(data => {
      if (data.error) {
        appendSysMsg('❌ ' + data.error);
        return;
      }
      removeFile();
    })
    .catch(() => appendSysMsg('❌ Failed to send file'));
  }

  // ── File attach ───────────────────────────────────────────
  function triggerFileInput() {
    if (isBlocked) return;
    document.getElementById('fileInput').click();
  }

  function removeFile() {
    attachedFile = null;
    attachedContent = null;
    document.getElementById('fileChipBar').style.display = 'none';
    document.getElementById('chipName').textContent = '';
    document.getElementById('chipSize').textContent = '';
    document.getElementById('attachBtn').classList.remove('has-file');
    const msgInput = document.getElementById('msgInput');
    msgInput.disabled = false;
    msgInput.placeholder = 'Message…';
  }

  document.getElementById('fileInput').addEventListener('change', function () {
    const file = this.files[0];
    if (!file) return;

    if (!file.name.toLowerCase().endsWith('.txt')) {
      appendSysMsg('❌ Only .txt files are supported');
      this.value = '';
      return;
    }
    if (file.size > 500 * 1024) {
      appendSysMsg('❌ File exceeds the 500 KB limit');
      this.value = '';
      return;
    }

    const reader = new FileReader();
    reader.onload = function (e) {
      attachedContent = e.target.result;
      attachedFile = file;

      document.getElementById('chipName').textContent = file.name;
      document.getElementById('chipSize').textContent =
        '(' + (file.size / 1024).toFixed(1) + ' KB)';
      document.getElementById('fileChipBar').style.display = 'flex';
      document.getElementById('attachBtn').classList.add('has-file');

      const msgInput = document.getElementById('msgInput');
      msgInput.disabled = true;
      msgInput.placeholder = 'Remove file to type a message';
    };
    reader.readAsText(file, 'utf-8');
    this.value = ''; // reset so same file can be re-attached
  });

  function handleKey(e) {
    // Send on Enter (not Shift+Enter) on desktop
    if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 600) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = '';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function flashInput(id) {
    const el = document.getElementById(id);
    el.style.borderColor = '#ef4444';
    setTimeout(() => { el.style.borderColor = ''; }, 1200);
  }

  // ── Bubbles ───────────────────────────────────────────────
  function appendBubble(direction, text, ts, blockIdx) {
    const container = document.getElementById('messages');
    const time = ts ? new Date(ts * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
    const blockTag = blockIdx !== undefined ? `<span class="block-tag">#${blockIdx}</span>` : '';

    const row = document.createElement('div');
    row.className = `msg-row ${direction}`;
    row.innerHTML = `<div class="bubble">${escHtml(text)}</div>
      <div class="msg-meta">${time}${blockTag}</div>`;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function appendSysMsg(text) {
    const container = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'sys-msg';
    div.textContent = text;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  // ── File receive: render bubble ───────────────────────
  function renderFileBubble(data) {
    const container = document.getElementById('messages');
    const direction = data.sender === myId ? 'sent' : 'recv';
    const time = data.timestamp
      ? new Date(data.timestamp * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
      : '';
    const sizeKB    = (data.size / 1024).toFixed(1);
    const hashShort = data.content_hash.slice(0, 16) + '…';

    const key = 'file_' + data.block_index;
    fileBubbleStore[key] = {
      content: data.content, filename: data.filename,
      hash: data.content_hash, blockIdx: data.block_index,
    };

    const row = document.createElement('div');
    row.className = `msg-row ${direction}`;
    row.innerHTML = `
      <div class="file-bubble file-bubble-${direction}">
        <div class="file-bubble-header">
          <span class="file-icon">📄</span>
          <div class="file-bubble-info">
            <div class="file-bubble-name" title="${escHtml(data.filename)}">${escHtml(data.filename)}</div>
            <div class="file-bubble-size">${sizeKB} KB <span class="block-tag">#${data.block_index}</span></div>
          </div>
        </div>
        <div class="file-bubble-hash" title="${escHtml(data.content_hash)}">${escHtml(hashShort)}</div>
        <div class="file-bubble-actions">
          <button class="file-bubble-btn" onclick="showPreviewByKey('${key}')">Preview</button>
          <button class="file-bubble-btn" onclick="saveFileByKey('${key}')">Save</button>
          <button class="file-bubble-btn primary" onclick="saveFileAsByKey('${key}')">Save As</button>
        </div>
      </div>
      <div class="msg-meta">${time}</div>`;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  // ── File save / preview ───────────────────────────────
  function saveFile(content, filename) {
    const blob = new Blob([content], {type: 'text/plain;charset=utf-8'});
    const url  = URL.createObjectURL(blob);
    const a    = Object.assign(document.createElement('a'), {href: url, download: filename});
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  async function saveFileAs(content, filename) {
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: filename,
          types: [{description: 'Text file', accept: {'text/plain': ['.txt']}}],
        });
        const w = await handle.createWritable();
        await w.write(content);
        await w.close();
        return;
      } catch (e) {
        if (e.name === 'AbortError') return;
      }
    }
    saveFile(content, filename);
  }

  function showPreview(filename, content, hash, blockIdx) {
    document.getElementById('previewFilename').textContent = filename;
    document.getElementById('previewMeta').textContent =
      'SHA-256: ' + hash + '  ·  block #' + blockIdx;
    document.getElementById('previewContent').textContent = content;
    document.getElementById('previewModal').style.display = 'flex';
  }

  function closePreview() {
    document.getElementById('previewModal').style.display = 'none';
  }

  function showPreviewByKey(key) {
    const d = fileBubbleStore[key];
    if (d) showPreview(d.filename, d.content, d.hash, d.blockIdx);
  }
  function saveFileByKey(key) {
    const d = fileBubbleStore[key];
    if (d) saveFile(d.content, d.filename);
  }
  async function saveFileAsByKey(key) {
    const d = fileBubbleStore[key];
    if (d) await saveFileAs(d.content, d.filename);
  }

  // ── Blocked status ────────────────────────────────────────
  function applyBlockedState(blocked) {
    isBlocked = blocked;
    document.getElementById('blockedBanner').style.display = blocked ? 'block' : 'none';
    document.getElementById('sendBtn').disabled   = blocked;
    document.getElementById('attachBtn').disabled = blocked;
    if (blocked) removeFile();
    const badge = document.getElementById('statusBadge');
    badge.textContent = blocked ? 'Blocked' : 'Online';
    badge.className   = blocked ? 'badge blocked' : 'badge';
  }

  // ── SocketIO handlers ─────────────────────────────────────
  socket.on('snapshot', data => {
    if (myId) {
      applyBlockedState((data.blocked || []).includes(myId));
    }
    refreshDevices();
  });

  socket.on('device_update', data => {
    if (myId) {
      const blocked = (data.blocked || []).includes(myId);
      if (blocked !== isBlocked) {
        applyBlockedState(blocked);
        appendSysMsg(blocked ? '🚫 Admin blocked your device' : '✅ Admin unblocked your device');
      }
    }
    refreshDevices();
  });

  socket.on('new_message', msg => {
    if (msg.receiver === myId) {
      appendBubble('recv', msg.payload, msg.timestamp, msg.block_index);
    }
  });

  socket.on('new_file', data => {
    if (data.sender === myId || data.receiver === myId) {
      renderFileBubble(data);
    }
  });

  // Re-join room after reconnect
  socket.on('connect', () => {
    if (myId) socket.emit('join', {mac: myId, role: 'client'});
  });

  // Allow submit with Enter on join screen
  document.getElementById('deviceIdInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinNetwork();
  });
  document.getElementById('hostnameInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') joinNetwork();
  });
</script>
</body>
</html>
